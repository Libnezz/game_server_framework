services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gsf-dev:latest
    container_name: gsf-dev
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 端口示例：等 gate/登录服务就绪后取消注释
    # ports:
    #   - "8000:8000"   # 客户端接入
    #   - "2013:2013"   # skynet master (standalone)
  mysql:
    image: mysql:8.0
    container_name: gsf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: gsf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
