syntax = "proto3";
package AnimeOpenWorld.Exploration.V1;
option csharp_namespace = "AnimeOpenWorld.Game.Network";

// DESIGN ONLY. Not loaded by protoservice and not allowed by agent.
// Player identity is taken from the authenticated connection, never the payload.
// This contract records low-value development claims, not economic completion proof.
enum ExplorationPhase {
  EXPLORATION_PHASE_UNSPECIFIED = 0;
  EXPLORATION_AVAILABLE = 1;
  EXPLORATION_IN_PROGRESS = 2;
  EXPLORATION_COMPLETED = 3;
}

message ExplorationStateRequest {
  int32 goal_id = 1;
  int32 definition_version = 2;
}

message ExplorationStateResponse {
  int32 schema_version = 1;
  int32 goal_id = 2;
  int32 definition_version = 3;
  int64 revision = 4; // 0 for absent row; otherwise 1..9007199254740991.
  repeated int32 completed_point_ids = 5;
  ExplorationPhase phase = 6; // Must match the validated completed-point set.
}

message RecordExplorationPointRequest {
  int32 goal_id = 1;
  int32 definition_version = 2;
  int32 point_id = 3;
  int64 expected_revision = 4;
}

enum ExplorationRecordResult {
  EXPLORATION_RECORD_RESULT_UNSPECIFIED = 0;
  EXPLORATION_RECORDED = 1;
  EXPLORATION_ALREADY_RECORDED = 2;
  EXPLORATION_REVISION_CONFLICT = 3;
}

message RecordExplorationPointResponse {
  ExplorationRecordResult result = 1;
  ExplorationStateResponse state = 2;
}
