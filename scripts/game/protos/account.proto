syntax = "proto3";
package Game.Framework.Network;
option csharp_namespace = "AnimeOpenWorld.Game.Network";

// Synthetic local development credential. Never send real credentials over ws.
message AuthenticateRequest {
  string account_id = 1;
  string development_token = 2;
}
message AuthenticateResponse {
  string account_id = 1;
  string player_id = 2;
}
message PlayerProfileRequest {}
message ProfileItem {
  int32 item_id = 1;
  int32 count = 2;
}
message PlayerProfileResponse {
  string player_id = 1;
  int32 schema_version = 2;
  int64 revision = 3;
  string nickname = 4;
  int32 level = 5;
  int32 exp = 6;
  int64 coins = 7;
  int32 total_login_count = 8;
  int64 last_login_unix_seconds = 9;
  repeated ProfileItem items = 10;
}
